<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Tips</title>
    <link rel="stylesheet" href="src/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet" />
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            margin: 20px;
        }

        div.tip {
            position: fixed;
            font-size: 14px;
            width: 200px;
            background-color: var(--bg-surface);
            padding: 15px;
            border: 1px solid var(--accent);
            clip-path: var(--clip-notch);
            opacity: 1;
            transition: all 0.3s ease;
        }

        .tip .caption {
            font-size: var(--text-xxs);
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-bottom: 5px;

        }

        .tip .title {
            font-size: 14px;
            font-weight: 800;
            color: var(--accent);
        }

        .tip .desc {
            font-family: var(--font);
            font-size: 12px;
            color: var(--text-muted-light);
            text-align: justify;
            margin: 10px 0;
        }

        div.tip.tip-media {
            padding: 4px;
            width: auto;
        }

        div.tip.tip-media img {
            display: block;
            max-width: 320px;
            max-height: 240px;
        }

        div.tip.tip-media video {
            display: block;
            max-width: 320px;
            max-height: 240px;
        }

        .showcase-link {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--accent);
            text-decoration: underline;
            text-transform: lowercase;

            text-underline-offset: 4px;
            transition: all 0.5s ease;

        }

        .showcase-link:hover {
            color: white;
            text-shadow: none;

        }
    </style>
</head>

<body>
    <ul class="tools-list">
        <li class="chip" data-type="text"
            data-content='{"title":"VS Code","desc":"Primary editor, extensions, debugging"}'>
            VS Code
        </li>
        <li class="chip" data-type="text"
            data-content='{"title":"IntelliJ IDEA","desc":"Java IDE, refactoring, debugging"}'>
            IntelliJ IDEA
        </li>
        <li class="chip" data-type="text" data-content='{"title":"Antigravity","desc":"AI coding assistant by Google"}'>
            Antigravity
        </li>
        <li class="chip" data-type="text" data-content='{"title":"OpenCode","desc":"AI coding agent platform"}'>
            OpenCode
        </li>
        <li class="chip" data-type="text" data-content='{"title":"Charm&#39;s Crush","desc":"Terminal UI framework"}'>
            Charm's Crush
        </li>
        <li class="chip" data-type="text" data-content='{"title":"Hermes","desc":"AI agent by Nous Research"}'>
            Hermes
        </li>
        <li class="chip" data-type="text" data-content='{"title":"Codex","desc":"AI coding assistant by LobeHub"}'>
            Codex
        </li>
        <li class="chip" data-type="text" data-content='{"title":"Neovim","desc":"Modern Vim-based editor"}'>
            Neovim
        </li>
        <li class="chip" data-type="text" data-content='{"title":"SQLite","desc":"Embedded SQL database engine"}'>
            SQLite
        </li>
        <li class="chip" data-type="media"
            data-content='{"media-type":"img","link":"https://github.com/user-attachments/assets/44f22963-bd08-4449-8801-f7fd118d7409"}'>
            YOLO Rescue SIM</li>
    </ul>

    <br><br><br><br>

</body>

<script>

    class Tip {
        constructor({ caption = "", title = "Tip Title", desc = "", linkCaption = "see here", link = "" } = {}) {
            this.caption = caption;
            this.title = title;
            this.desc = desc;
            this.linkCaption = linkCaption;
            this.link = link;
        }
    }

    class MediaTip {
        constructor({ "media-type": mediaType, link } = {}) {
            this.mediaType = mediaType;
            this.link = link;
        }
    }

    function createTip(tip) {

        const tipEl = document.createElement("div");
        tipEl.classList.add("tip");
        tipEl.innerHTML = `
            ${tip.caption ? `<p class="caption">${tip.caption} ↴</p>` : ''}
            <p class="title">${tip.title}</p>
            <p class="desc">${tip.desc}</p>
            ${tip.link ? `<a href="${tip.link}" class="showcase-link">${tip.linkCaption} →</a>` : ''}
        `;
        return tipEl;
    }

    function createMediaTip(mediaTip) {
        const tipEl = document.createElement("div");
        tipEl.classList.add("tip", "tip-media");
        if (!mediaTip.link) {
            tipEl.innerHTML = '<span style="padding:0.5rem;color:var(--text-muted);">No media yet</span>';
            return tipEl;
        }
        if (mediaTip.mediaType === "video") {
            tipEl.innerHTML = `<video src="${mediaTip.link}" controls muted autoplay loop></video>`;
        } else {
            tipEl.innerHTML = `<img src="${mediaTip.link}" alt="preview" onerror="this.outerHTML='<span style=\\'padding:0.5rem;color:var(--text-muted);\\'>Broken image</span>'" />`;
        }
        return tipEl;
    }

    let leaveTimeout = null; // stores the setTimeout ID, not the duration

    document.querySelectorAll(".chip").forEach((chip) => {
        let currentTip = null;

        chip.addEventListener("mouseenter", (e) => {

            const type = chip.dataset.type;
            const data = JSON.parse(chip.getAttribute("data-content"));
            let tipElement;

            if (type === "media") {
                const mediaTip = new MediaTip(data);
                tipElement = createMediaTip(mediaTip);
            } else {
                const dummyTip = new Tip(data);
                tipElement = createTip(dummyTip);
            }

            currentTip = tipElement;


            // ? the element is created and listeners are added

            tipElement.addEventListener("mouseenter", () => {
                // if the mouse enters the tip, we don't want to hide it
                clearTimeout(leaveTimeout); // clear the leaveTimeout so it doesn't hide the tip

            });


            tipElement.addEventListener("mouseleave", () => {

                leaveTimeout = setTimeout(() => {
                    if (!currentTip) return; // already handled by another timeout
                    const hidingTip = currentTip;
                    currentTip = null;
                    hidingTip.style.opacity = '0';

                    hidingTip.addEventListener('transitionend', () => {
                        hidingTip.remove();
                    }, { once: true });
                }, 300);
            });

            // start invisible so we can measure, then fade in
            tipElement.style.opacity = '0';
            document.querySelector("body").appendChild(tipElement); // add the element

            const rect = chip.getBoundingClientRect(); // get its cordinates

            tipElement.style.top = rect.bottom + 10 + 'px'; // move it below the chip
            tipElement.style.left = rect.left + 'px'; // move it to the left of the chip

            const rightEdge = rect.left + tipElement.offsetWidth;

            if (rightEdge > window.innerWidth) {
                tipElement.style.left = (window.innerWidth - tipElement.offsetWidth - 25) + 'px';
            }

            if (parseInt(tipElement.style.left) < 25) {
                tipElement.style.left = '15px';
            }

            // force reflow then fade in
            tipElement.getBoundingClientRect();
            tipElement.style.opacity = '1';

        });

        chip.addEventListener("mouseleave", (e) => {

            leaveTimeout = setTimeout(() => {

                if (!currentTip) return;
                const hidingTip = currentTip;
                currentTip = null;
                hidingTip.style.opacity = '0';

                hidingTip.addEventListener('transitionend', () => {
                    hidingTip.remove();
                }, { once: true });

            }, 200); // hide after 200ms



        });

    });

    // Preload media tip images in background
    document.querySelectorAll('.chip[data-type="media"]').forEach(chip => {
        const data = JSON.parse(chip.getAttribute('data-content'));
        if (data.link) {
            const img = new Image();
            img.src = data.link;
        }
    });
</script>

</html>
